services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proofpass
      POSTGRES_PASSWORD: proofpass
      POSTGRES_DB: proofpass
    ports:
      - "5432:5432"
    volumes:
      - proofpass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpass -d proofpass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofpass_postgres:
